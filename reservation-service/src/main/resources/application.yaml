spring:
  application:
    name: reservation-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reservation_db?rewriteBatchedStatements=true}
    username: ${DB_USERNAME:reservation_user}
    password: ${DB_PASSWORD:reservation_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s

app:
  slot-search:
    maximum-range: 30d
    default-page-size: 20
    maximum-page-size: 100
  slots-cache:
    enabled: ${SLOTS_CACHE_ENABLED:true}
    head-size: 101
    minimum-ttl: 30s
    maximum-ttl: 60s
    lock-lease: 3s
    lock-retry-delays:
      - 25ms
      - 50ms
  performance-seeding:
    enabled: ${APP_PERFORMANCE_SEEDING_ENABLED:false}
    user-password: ${APP_PERFORMANCE_USER_PASSWORD:TestPassword123}
    batch-size: 5000

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: "PtKhd0onRsnE8SgZUO4Jp2eBWYd3DTg9llEQ5DcyM+M="
    access-token-expiration: 1h
