spring:
  application:
    name: reservation-service

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/reservation_db?rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:reservation_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s

app:
  slot-search:
    maximum-range: 30d
    default-page-size: 20
    maximum-page-size: 100
  slots-cache:
    enabled: ${SLOTS_CACHE_ENABLED:true}
    head-size: 101
    minimum-ttl: 30s
    maximum-ttl: 60s
    lock-lease: 3s
    lock-retry-delays:
      - 25ms
      - 50ms

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
