services:
  reservation-mysql:
    image: mysql:8.4
    container_name: reservation-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: reservation_db
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3306:3306"

    volumes:
      - reservation_mysql_data:/var/lib/mysql

  reservation-mysql-perf:
    image: mysql:8.4
    container_name: reservation-mysql-perf
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: reservation_perf
      MYSQL_USER: reservation_perf_user
      MYSQL_PASSWORD: reservation_perf_password
      MYSQL_ROOT_PASSWORD: perf_root_password

    ports:
      - "3307:3306"

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

    volumes:
      - reservation_mysql_perf_data:/var/lib/mysql

  reservation-redis:
    image: redis:7.4-alpine
    container_name: reservation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  reservation_mysql_data:
  reservation_mysql_perf_data:
