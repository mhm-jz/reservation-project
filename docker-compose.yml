services:
  reservation-mysql:
    image: mysql:8.4
    container_name: reservation-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reservation_db}
      MYSQL_USER: ${DB_USERNAME:-reservation_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

    volumes:
      - reservation_mysql_data:/var/lib/mysql

  reservation-redis:
    image: redis:7.4-alpine
    container_name: reservation-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  reservation_mysql_data:
